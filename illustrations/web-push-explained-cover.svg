<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg_gradient)" />

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- === Main visualization === -->
  <g transform="translate(0, 30)">

    <!-- SERVER node (left) -->
    <g opacity="0.85">
      <circle cx="200" cy="290" r="42" fill="url(#paint_server)" />
      <circle cx="200" cy="290" r="42" fill="none" stroke="url(#stroke_purple)" stroke-width="2" opacity="0.6" />
      <!-- Server rack icon -->
      <g stroke="white" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round">
        <rect x="184" y="274" width="32" height="32" rx="4" fill="none" />
        <line x1="184" y1="284" x2="216" y2="284" />
        <line x1="184" y1="296" x2="216" y2="296" />
        <circle cx="207" cy="279" r="2" fill="#9B6BFF" stroke="none" />
        <circle cx="207" cy="290" r="2" fill="#4AD8E5" stroke="none" />
        <circle cx="207" cy="301" r="2" fill="#9B6BFF" stroke="none" />
      </g>
      <text x="200" y="360" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.1em">SERVER</text>
    </g>

    <!-- Arrow: Server → Push Service -->
    <g opacity="0.5">
      <line x1="250" y1="290" x2="440" y2="290" stroke="url(#arrow_grad_1)" stroke-width="2.5" stroke-dasharray="12 6" />
      <polygon points="450,290 438,284 438,296" fill="#9B6BFF" fill-opacity="0.7" />
    </g>

    <!-- PUSH SERVICE node (center) -->
    <g opacity="0.95">
      <circle cx="600" cy="290" r="55" fill="url(#paint_push)" />
      <circle cx="600" cy="290" r="55" fill="none" stroke="url(#stroke_glow)" stroke-width="3" opacity="0.7" />
      <circle cx="600" cy="290" r="72" fill="none" stroke="url(#stroke_glow)" stroke-width="1" opacity="0.25" />
      <!-- Lock icon -->
      <g transform="translate(588, 272)">
        <rect x="0" y="12" width="24" height="18" rx="3" fill="none" stroke="#4AD8E5" stroke-width="1.8" opacity="0.75" />
        <path d="M6 12 V8 A6 6 0 0 1 18 8 V12" fill="none" stroke="#4AD8E5" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
        <circle cx="12" cy="22" r="2.5" fill="#4AD8E5" opacity="0.75" />
      </g>
      <text x="600" y="375" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.1em">PUSH SERVICE</text>
    </g>

    <!-- Animated signal pulses from push service -->
    <circle cx="600" cy="290" r="55" fill="none" stroke="#4AD8E5" stroke-width="1" opacity="0.15">
      <animate attributeName="r" values="55;130" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="290" r="55" fill="none" stroke="#9B6BFF" stroke-width="1" opacity="0.1">
      <animate attributeName="r" values="55;130" dur="3s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0" dur="3s" begin="1s" repeatCount="indefinite" />
    </circle>

    <!-- Arrow: Push Service → Device -->
    <g opacity="0.5">
      <line x1="760" y1="290" x2="940" y2="290" stroke="url(#arrow_grad_2)" stroke-width="2.5" stroke-dasharray="12 6" />
      <polygon points="950,290 938,284 938,296" fill="#FF7AC3" fill-opacity="0.7" />
    </g>

    <!-- DEVICE node (right) -->
    <g opacity="0.85">
      <circle cx="1000" cy="290" r="42" fill="url(#paint_device)" />
      <circle cx="1000" cy="290" r="42" fill="none" stroke="url(#stroke_pink)" stroke-width="2" opacity="0.6" />
      <!-- Bell icon -->
      <g transform="translate(987, 272)">
        <path d="M13 2 C7 2 2 8 2 14 L2 18 L24 18 L24 14 C24 8 19 2 13 2Z" fill="none" stroke="#FF7AC3" stroke-width="1.8" opacity="0.7" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="9" y1="18" x2="9" y2="21" stroke="#FF7AC3" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
        <line x1="17" y1="18" x2="17" y2="21" stroke="#FF7AC3" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
        <circle cx="13" cy="22" r="3" fill="none" stroke="#FF7AC3" stroke-width="1.5" opacity="0.5" />
      </g>
      <text x="1000" y="360" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.1em">DEVICE</text>
    </g>

    <!-- Connection indicator dots on arrows -->
    <g fill="white" fill-opacity="0.4">
      <circle cx="350" cy="290" r="4">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="850" cy="290" r="4">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" begin="0.5s" repeatCount="indefinite" />
      </circle>
    </g>

  </g>

  <!-- Bottom tech tags -->
  <g font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.15em" text-anchor="middle">
    <text x="300" y="560" fill="#9B6BFF" fill-opacity="0.5">VAPID</text>
    <text x="450" y="560" fill="#4AD8E5" fill-opacity="0.5">PUSH API</text>
    <text x="600" y="560" fill="#6BC5FF" fill-opacity="0.5">SERVICE WORKER</text>
    <text x="750" y="560" fill="#C06BFF" fill-opacity="0.5">AES-128-GCM</text>
    <text x="900" y="560" fill="#FF7AC3" fill-opacity="0.5">RFC 8030</text>
  </g>

  <!-- Decorative corner glows -->
  <circle cx="50" cy="50" r="80" fill="#9B6BFF" opacity="0.04" />
  <circle cx="1150" cy="580" r="100" fill="#FF7AC3" opacity="0.04" />

  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a12" />
      <stop offset="0.5" stop-color="#0d1020" />
      <stop offset="1" stop-color="#0a0a14" />
    </linearGradient>

    <radialGradient id="paint_server" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 290) scale(42)">
      <stop stop-color="#9B6BFF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#9B6BFF" stop-opacity="0.15" />
    </radialGradient>

    <linearGradient id="stroke_purple" x1="158" y1="248" x2="242" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B6BFF" stop-opacity="0.7" />
      <stop offset="1" stop-color="#9B6BFF" stop-opacity="0.25" />
    </linearGradient>

    <radialGradient id="paint_push" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 290) scale(55)">
      <stop stop-color="#4AD8E5" stop-opacity="0.4" />
      <stop offset="0.6" stop-color="#9B6BFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#0d1020" stop-opacity="0.15" />
    </radialGradient>

    <linearGradient id="stroke_glow" x1="545" y1="290" x2="655" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AD8E5" stop-opacity="0.8" />
      <stop offset="0.5" stop-color="#9B6BFF" stop-opacity="0.7" />
      <stop offset="1" stop-color="#4AD8E5" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="paint_device" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 290) scale(42)">
      <stop stop-color="#FF7AC3" stop-opacity="0.5" />
      <stop offset="1" stop-color="#FF7AC3" stop-opacity="0.15" />
    </radialGradient>

    <linearGradient id="stroke_pink" x1="958" y1="248" x2="1042" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7AC3" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FF7AC3" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="arrow_grad_1" x1="250" y1="290" x2="450" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B6BFF" stop-opacity="0.6" />
      <stop offset="1" stop-color="#4AD8E5" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="arrow_grad_2" x1="760" y1="290" x2="950" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AD8E5" stop-opacity="0.6" />
      <stop offset="1" stop-color="#FF7AC3" stop-opacity="0.6" />
    </linearGradient>
  </defs>
</svg>
