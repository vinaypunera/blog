<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#334155" opacity="0.25"/>
    </pattern>
  </defs>
  
  <!-- Base background -->
  <rect width="1584" height="396" fill="url(#bgGradient)"/>
  <rect width="1584" height="396" fill="url(#gridPattern)"/>
  
  <!-- Central voice waveform - flowing across the canvas -->
  <g transform="translate(350, 198)">
    <!-- Main waveform bars -->
    <rect x="0" y="-25" width="6" height="50" rx="3" fill="#3b82f6" opacity="0.35"/>
    <rect x="20" y="-45" width="6" height="90" rx="3" fill="#3b82f6" opacity="0.45"/>
    <rect x="40" y="-70" width="6" height="140" rx="3" fill="#3b82f6" opacity="0.55"/>
    <rect x="60" y="-95" width="7" height="190" rx="3.5" fill="#4f6cf6" opacity="0.65"/>
    <rect x="82" y="-115" width="8" height="230" rx="4" fill="#6366f1" opacity="0.75"/>
    <rect x="106" y="-130" width="8" height="260" rx="4" fill="#6366f1" opacity="0.85"/>
    <rect x="130" y="-140" width="9" height="280" rx="4.5" fill="url(#waveGradient)" opacity="0.95"/>
    <rect x="156" y="-130" width="8" height="260" rx="4" fill="#7c3aed" opacity="0.85"/>
    <rect x="180" y="-115" width="8" height="230" rx="4" fill="#8b5cf6" opacity="0.75"/>
    <rect x="204" y="-95" width="7" height="190" rx="3.5" fill="#8b5cf6" opacity="0.65"/>
    <rect x="226" y="-70" width="6" height="140" rx="3" fill="#a78bfa" opacity="0.55"/>
    <rect x="246" y="-45" width="6" height="90" rx="3" fill="#a78bfa" opacity="0.45"/>
    <rect x="266" y="-25" width="6" height="50" rx="3" fill="#c4b5fd" opacity="0.35"/>
  </g>
  
  <!-- Secondary waveform echo - subtle depth -->
  <g transform="translate(380, 198)" opacity="0.25">
    <rect x="0" y="-20" width="4" height="40" rx="2" fill="#3b82f6"/>
    <rect x="16" y="-35" width="4" height="70" rx="2" fill="#3b82f6"/>
    <rect x="32" y="-55" width="4" height="110" rx="2" fill="#6366f1"/>
    <rect x="48" y="-75" width="5" height="150" rx="2.5" fill="#6366f1"/>
    <rect x="66" y="-90" width="5" height="180" rx="2.5" fill="#8b5cf6"/>
    <rect x="84" y="-100" width="6" height="200" rx="3" fill="#8b5cf6"/>
    <rect x="104" y="-90" width="5" height="180" rx="2.5" fill="#8b5cf6"/>
    <rect x="122" y="-75" width="5" height="150" rx="2.5" fill="#a78bfa"/>
    <rect x="140" y="-55" width="4" height="110" rx="2" fill="#a78bfa"/>
    <rect x="156" y="-35" width="4" height="70" rx="2" fill="#c4b5fd"/>
    <rect x="172" y="-20" width="4" height="40" rx="2" fill="#c4b5fd"/>
  </g>
  
  <!-- Neural network - right side -->
  <g transform="translate(920, 198)">
    <!-- Input layer -->
    <circle cx="0" cy="-100" r="7" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="-50" r="7" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="50" r="7" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="100" r="7" fill="#3b82f6" opacity="0.7"/>
    
    <!-- Hidden layer 1 -->
    <circle cx="100" cy="-75" r="8" fill="#6366f1" opacity="0.8"/>
    <circle cx="100" cy="-25" r="8" fill="#6366f1" opacity="0.8"/>
    <circle cx="100" cy="25" r="8" fill="#6366f1" opacity="0.8"/>
    <circle cx="100" cy="75" r="8" fill="#6366f1" opacity="0.8"/>
    
    <!-- Hidden layer 2 -->
    <circle cx="200" cy="-50" r="9" fill="#8b5cf6" opacity="0.85"/>
    <circle cx="200" cy="0" r="9" fill="#8b5cf6" opacity="0.85"/>
    <circle cx="200" cy="50" r="9" fill="#8b5cf6" opacity="0.85"/>
    
    <!-- Output layer -->
    <circle cx="300" cy="-25" r="10" fill="url(#accentGradient)"/>
    <circle cx="300" cy="25" r="10" fill="url(#accentGradient)"/>
    
    <!-- Connections - input to hidden 1 -->
    <line x1="7" y1="-100" x2="92" y2="-75" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="7" y1="-50" x2="92" y2="-75" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
    <line x1="7" y1="-50" x2="92" y2="-25" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
    <line x1="7" y1="0" x2="92" y2="-25" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="7" y1="0" x2="92" y2="25" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="7" y1="50" x2="92" y2="25" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
    <line x1="7" y1="50" x2="92" y2="75" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
    <line x1="7" y1="100" x2="92" y2="75" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    
    <!-- Connections - hidden 1 to hidden 2 -->
    <line x1="108" y1="-75" x2="191" y2="-50" stroke="#6366f1" stroke-width="1.2" opacity="0.4"/>
    <line x1="108" y1="-75" x2="191" y2="0" stroke="#6366f1" stroke-width="1.2" opacity="0.35"/>
    <line x1="108" y1="-25" x2="191" y2="-50" stroke="#6366f1" stroke-width="1.2" opacity="0.4"/>
    <line x1="108" y1="-25" x2="191" y2="0" stroke="#6366f1" stroke-width="1.2" opacity="0.45"/>
    <line x1="108" y1="25" x2="191" y2="0" stroke="#6366f1" stroke-width="1.2" opacity="0.45"/>
    <line x1="108" y1="25" x2="191" y2="50" stroke="#6366f1" stroke-width="1.2" opacity="0.4"/>
    <line x1="108" y1="75" x2="191" y2="0" stroke="#6366f1" stroke-width="1.2" opacity="0.35"/>
    <line x1="108" y1="75" x2="191" y2="50" stroke="#6366f1" stroke-width="1.2" opacity="0.4"/>
    
    <!-- Connections - hidden 2 to output -->
    <line x1="209" y1="-50" x2="290" y2="-25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <line x1="209" y1="-50" x2="290" y2="25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="209" y1="0" x2="290" y2="-25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.55"/>
    <line x1="209" y1="0" x2="290" y2="25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.55"/>
    <line x1="209" y1="50" x2="290" y2="-25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="209" y1="50" x2="290" y2="25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Data flow particles - connecting waveform to neural net -->
  <g opacity="0.6">
    <circle cx="680" cy="178" r="3" fill="#6366f1"/>
    <circle cx="720" cy="198" r="2.5" fill="#8b5cf6"/>
    <circle cx="760" cy="188" r="2" fill="#a78bfa"/>
    <circle cx="800" cy="208" r="3" fill="#6366f1"/>
    <circle cx="840" cy="193" r="2.5" fill="#8b5cf6"/>
    <circle cx="880" cy="203" r="2" fill="#a78bfa"/>
  </g>
  
  <!-- Subtle bottom accent line -->
  <rect x="0" y="392" width="1584" height="4" fill="url(#accentGradient)" opacity="0.7"/>
</svg>