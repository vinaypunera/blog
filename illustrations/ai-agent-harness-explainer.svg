<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LLM brain enclosed in a creative agent harness structure">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.5" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="llmFill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="0.7" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="1" stop-color="#020617" stop-opacity="0.1" />
    </radialGradient>
    <radialGradient id="llmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="36" fill="url(#bgGradient)" />
  <rect width="1200" height="630" rx="36" fill="url(#bgGlow)" />

  <!-- ====== THE HARNESS (Creative orbital cage) ====== -->

  <!-- Harness Ring 1: Horizontal ellipse -->
  <ellipse cx="600" cy="315" rx="220" ry="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" transform="rotate(-15 600 315)" />

  <!-- Harness Ring 2: Tilted ellipse -->
  <ellipse cx="600" cy="315" rx="220" ry="100" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" transform="rotate(45 600 315)" />

  <!-- Harness Ring 3: Counter-tilted ellipse -->
  <ellipse cx="600" cy="315" rx="220" ry="100" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.25" transform="rotate(-75 600 315)" />



  <!-- ====== PERIPHERAL NODES (on the harness rings) ====== -->

  <!-- Context node (top-left area) -->
  <circle cx="340" cy="160" r="24" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="340" cy="160" r="5" fill="#38bdf8" fill-opacity="0.7" />
  <text x="340" y="205" fill="#94a3b8" font-family="'Inter', 'Geist', sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.12em">Context</text>

  <!-- Tools node (top-right area) -->
  <circle cx="860" cy="160" r="24" fill="#7c3aed" fill-opacity="0.15" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="860" cy="160" r="5" fill="#a855f7" fill-opacity="0.7" />
  <text x="860" y="205" fill="#94a3b8" font-family="'Inter', 'Geist', sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.12em">Tools</text>

  <!-- Feedback node (bottom-left) -->
  <circle cx="340" cy="470" r="24" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="340" cy="470" r="5" fill="#f97316" fill-opacity="0.7" />
  <text x="340" y="515" fill="#94a3b8" font-family="'Inter', 'Geist', sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.12em">Feedback</text>

  <!-- Execution node (bottom-right) -->
  <circle cx="860" cy="470" r="24" fill="#fb7185" fill-opacity="0.15" stroke="#fb7185" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="860" cy="470" r="5" fill="#fb7185" fill-opacity="0.7" />
  <text x="860" y="515" fill="#94a3b8" font-family="'Inter', 'Geist', sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.12em">Execution</text>

  <!-- ====== LLM CORE (Center) ====== -->
  <!-- Outer glow -->
  <circle cx="600" cy="315" r="120" fill="url(#llmGlow)" />

  <!-- Main LLM circle -->
  <circle cx="600" cy="315" r="56" fill="url(#llmFill)" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Inner neural triangle -->
  <g fill="#f8fafc" fill-opacity="0.6" stroke="#f8fafc" stroke-opacity="0.3" stroke-width="1.2">
    <circle cx="600" cy="300" r="3" />
    <circle cx="588" cy="324" r="3" />
    <circle cx="612" cy="324" r="3" />
    <path d="M600 300 L588 324 L612 324 Z" fill="none" />
  </g>

  <!-- LLM label -->
  <text x="600" y="395" fill="#c4b5fd" font-family="'Inter', 'Geist', sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.15em">LLM</text>
</svg>
